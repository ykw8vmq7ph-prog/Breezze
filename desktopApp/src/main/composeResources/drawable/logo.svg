<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="breezzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF2D75"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="128" fill="url(#breezzeGrad)"/>
  
  <!-- Main Breezze logomark centered -->
  <g filter="url(#glow)" transform="translate(172, 172)">
    <!-- Left vertical bar -->
    <rect x="0" y="0" width="112" height="680" rx="16" fill="white"/>
    
    <!-- Right vertical bar -->
    <rect x="540" y="0" width="112" height="680" rx="16" fill="white"/>
    
    <!-- Center Ξ (three horizontal bars) -->
    <rect x="152" y="136" width="348" height="56" rx="12" fill="white"/>
    <rect x="152" y="384" width="348" height="56" rx="12" fill="white"/>
    <rect x="152" y="632" width="348" height="56" rx="12" fill="white"/>
    
    <!-- Ø accent - diagonal slash through center -->
    <line x1="188" y1="80" x2="692" y2="600" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  </g>
  
  <!-- Wordmark "Breezze" below -->
  <text x="512" y="920" font-family="system-ui, sans-serif" font-weight="700" font-size="72" fill="white" text-anchor="middle" letter-spacing="4">Breezze</text>
</svg>