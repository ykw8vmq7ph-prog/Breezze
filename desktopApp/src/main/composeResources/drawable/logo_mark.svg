<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="breezzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF2D75"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <rect x="52" y="44" width="24" height="168" rx="3" fill="url(#breezzeGrad)"/>
    
    <!-- Right vertical bar -->
    <rect x="180" y="44" width="24" height="168" rx="3" fill="url(#breezzeGrad)"/>
    
    <!-- Center Ξ (three horizontal bars) -->
    <rect x="88" y="72" width="80" height="12" rx="2" fill="url(#breezzeGrad)"/>
    <rect x="88" y="122" width="80" height="12" rx="2" fill="url(#breezzeGrad)"/>
    <rect x="88" y="172" width="80" height="12" rx="2" fill="url(#breezzeGrad)"/>
    
    <!-- Ø diagonal slash -->
    <line x1="108" y1="58" x2="164" y2="198" stroke="url(#breezzeGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>